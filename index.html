<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>City Council Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }

    #session-picker {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #3a3d4a;
      background: #0f1117;
      color: #e0e0e0;
      font-size: 0.875rem;
      min-width: 180px;
    }

    #youtube-input {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #3a3d4a;
      background: #0f1117;
      color: #e0e0e0;
      font-size: 0.875rem;
    }

    #youtube-input::placeholder { color: #555; }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .video-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #player-placeholder {
      color: #444;
      font-size: 0.9rem;
      text-align: center;
    }

    #player { width: 100%; height: 100%; }
    #player iframe { width: 100%; height: 100%; }

    .sidebar {
      width: 340px;
      min-width: 280px;
      background: #1a1d27;
      border-left: 1px solid #2a2d3a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar h2 {
      padding: 14px 16px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      border-bottom: 1px solid #2a2d3a;
    }

    #timeline {
      overflow-y: auto;
      flex: 1;
    }

    .item {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid #22253a;
      cursor: pointer;
      transition: background 0.1s;
    }

    .item:hover { background: #22263a; }
    .item.active { background: #1e2a4a; border-left: 3px solid #3b5bdb; }

    .timestamp {
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: #3b82f6;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .item-id {
      font-size: 0.75rem;
      color: #666;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .item-label {
      font-size: 0.85rem;
      color: #ccc;
      line-height: 1.3;
    }

    .item.vote .item-label {
      color: #f59e0b;
    }

    .item.vote .item-id {
      color: #92400e;
    }

    .badge {
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 3px;
      background: #78350f;
      color: #fcd34d;
      flex-shrink: 0;
      align-self: center;
    }

    #login-overlay {
      position: fixed;
      inset: 0;
      background: #0f1117;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #login-box {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 300px;
    }

    #login-box h2 {
      font-size: 1rem;
      color: #fff;
      font-weight: 600;
      margin-bottom: 4px;
    }

    #login-box input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #3a3d4a;
      background: #0f1117;
      color: #e0e0e0;
      font-size: 0.875rem;
      width: 100%;
    }

    #login-box button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      background: #3b5bdb;
      color: #fff;
      font-size: 0.875rem;
      cursor: pointer;
    }

    #login-box button:hover { background: #4c6ef5; }

    #login-error {
      font-size: 0.8rem;
      color: #f87171;
      display: none;
    }

    #share-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #3a3d4a;
      background: #1a1d27;
      color: #e0e0e0;
      font-size: 0.875rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #share-btn:hover { background: #22263a; }
    #share-btn.copied { color: #4ade80; border-color: #4ade80; }
  </style>
</head>
<body>

<div id="login-overlay">
  <div id="login-box">
    <h2>City Council Analyzer</h2>
    <input id="login-user" type="text" placeholder="Username" autocomplete="username" />
    <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" />
    <span id="login-error">Invalid username or password.</span>
    <button onclick="doLogin()">Sign in</button>
  </div>
</div>

<header>
  <h1>City Council Analyzer</h1>
  <select id="session-picker" onchange="onSessionChange()"></select>
  <input id="youtube-input" type="text" placeholder="YouTube URL or video ID" onkeydown="if(event.key==='Enter')loadVideo()" />
  <button id="share-btn" onclick="shareCurrentPosition()">Share</button>
</header>

<div class="main">
  <div class="video-panel">
    <div id="player-placeholder">Select a meeting above to load the recording.</div>
    <div id="player-error" style="display:none;color:#f87171;font-size:0.9rem;text-align:center;">No video link available for this session.</div>
    <div id="player"></div>
  </div>

  <aside class="sidebar">
    <h2>Timeline</h2>
    <div id="timeline"></div>
  </aside>
</div>

<script>
  (function() {
    var overlay = document.getElementById('login-overlay');
    var passInput = document.getElementById('login-pass');

    if (localStorage.getItem('cca_auth') === '1') {
      overlay.style.display = 'none';
    }

    passInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    window.doLogin = function() {
      var user = document.getElementById('login-user').value;
      var pass = document.getElementById('login-pass').value;
      if (user === 'gruene' && pass === 'stadtrat') {
        localStorage.setItem('cca_auth', '1');
        overlay.style.display = 'none';
      } else {
        document.getElementById('login-error').style.display = 'block';
        passInput.value = '';
        passInput.focus();
      }
    };
  })();
</script>

  var player = null;
  var playerReady = false;
  var pendingSeek = null;
  var pendingVideoId = null;

  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    if (pendingVideoId) {
      createPlayer(pendingVideoId);
      pendingVideoId = null;
    }
  }

  function createPlayer(videoId) {
    document.getElementById('player-placeholder').style.display = 'none';
    player = new YT.Player('player', {
      videoId: videoId,
      playerVars: { playsinline: 1, rel: 0, autoplay: 0 },
      events: {
        onReady: function() {
          playerReady = true;
          if (pendingSeek !== null) {
            player.seekTo(pendingSeek, true);
            pendingSeek = null;
          }
        }
      }
    });
  }

  function loadVideo() {
    var raw = document.getElementById('youtube-input').value.trim();
    if (!raw) return;
    var videoId = extractVideoId(raw);
    if (!videoId) return;
    if (player) {
      player.cueVideoById(videoId);
    } else if (typeof YT !== 'undefined' && YT.Player) {
      createPlayer(videoId);
    } else {
      pendingVideoId = videoId;
    }
  }

  function extractVideoId(url) {
    var m = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : (url.length === 11 ? url : null);
  }

  function seekTo(seconds) {
    if (player && playerReady) {
      player.seekTo(seconds, true);
    } else {
      pendingSeek = seconds;
    }
  }

  function timeToSeconds(t) {
    if (!t) return 0;
    var p = t.split(':');
    return parseInt(p[0]) * 3600 + parseInt(p[1]) * 60 + parseInt(p[2]);
  }

  function highlight(el) {

    el.classList.add('active');
  }

  function makeItem(seconds, id, label, isVote) {
    var timeStr = new Date(seconds * 1000).toISOString().substr(11, 8);
    var el = document.createElement('div');
    el.className = 'item' + (isVote ? ' vote' : '');
    el.innerHTML =
      '<span class="timestamp">' + timeStr + '</span>' +
      (isVote ? '<span class="badge">vote</span>' : '') +
      '<span class="item-id">' + id + '</span>' +
      '<span class="item-label">' + label + '</span>';
    el.addEventListener('click', function() { seekTo(seconds); highlight(el); });
    return el;
  }

  function buildTimeline(discussions, votes) {
    var entries = [];

    discussions.forEach(function(d) {
      var id = (d.id || '').trim();
      var title = (d.title || '').trim();
      if (id.toUpperCase().startsWith('ABSTIMMUNG')) return;
      entries.push({
        seconds: timeToSeconds(d.start_time),
        id: id,
        label: title || '—',
        isVote: false
      });
    });

    votes.forEach(function(v) {
      var id = (v.id || '').trim();
      entries.push({
        seconds: timeToSeconds(v.end_time),
        id: id,
        label: 'Abstimmung',
        isVote: true
      });
    });

    entries.sort(function(a, b) { return a.seconds - b.seconds; });

    var timeline = document.getElementById('timeline');
    timeline.innerHTML = '';
    activeItem = null;
    entries.forEach(function(e) {
      timeline.appendChild(makeItem(e.seconds, e.id, e.label, e.isVote));
    });

    var first = timeline.querySelector('.item');
    if (first) first.click();
  }

  function shareCurrentPosition() {
    var sessionId = document.getElementById('session-picker').value;
    var t = (player && playerReady) ? Math.floor(player.getCurrentTime()) : 0;
    var url = window.location.origin + window.location.pathname +
      '?session=' + encodeURIComponent(sessionId) + '&t=' + t;
    var btn = document.getElementById('share-btn');
    function flash() {
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(function() { btn.textContent = 'Share'; btn.classList.remove('copied'); }, 1500);
    }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(flash).catch(function() { window.prompt('Copy link:', url); });
    } else {
      window.prompt('Copy link:', url);
    }
  }

  function onSessionChange() {
    var id = document.getElementById('session-picker').value;
    if (!id) return;

    var session = SESSIONS_DATA[id];
    if (!session) return;

    var errorEl = document.getElementById('player-error');
    if (session.youtube_url) {
      errorEl.style.display = 'none';
      document.getElementById('youtube-input').value = session.youtube_url;
      loadVideo();
    } else {
      errorEl.style.display = 'block';
      document.getElementById('player-placeholder').style.display = 'none';
    }

    buildTimeline(session.discussions, session.votes);
  }

  // Populate session picker and apply URL params (?session=&t=)
  var picker = document.getElementById('session-picker');
  var sessionIds = Object.keys(SESSIONS_DATA);
  if (sessionIds.length === 0) {
    picker.style.display = 'none';
  } else {
    sessionIds.forEach(function(id) {
      var opt = document.createElement('option');
      opt.value = id;
      opt.textContent = SESSIONS_DATA[id].title;
      picker.appendChild(opt);
    });
    var urlParams = new URLSearchParams(window.location.search);
    var sessionParam = urlParams.get('session');
    var tParam = parseInt(urlParams.get('t') || '0') || 0;
    if (sessionParam && SESSIONS_DATA[sessionParam]) {
      picker.value = sessionParam;
    }
    onSessionChange();
    if (tParam) { seekTo(tParam); }
  }
</script>

</body>
</html>
