<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>City Council Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }

    #session-picker {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #3a3d4a;
      background: #0f1117;
      color: #e0e0e0;
      font-size: 0.875rem;
      min-width: 180px;
    }


    #youtube-input {
      max-width: 160px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #2a2d3a;
      background: transparent;
      color: #666;
      font-size: 0.875rem;
      cursor: default;
      pointer-events: none;
    }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .video-panel {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #speaker-overlay {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.78);
      border-left: 3px solid #3b5bdb;
      padding: 8px 14px;
      border-radius: 4px;
      display: none;
      pointer-events: none;
      z-index: 10;
      max-width: 320px;
    }

    #speaker-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
    }

    #speaker-meta {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 2px;
    }

    .speaker-entry + .speaker-entry {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    #player-placeholder {
      color: #444;
      font-size: 0.9rem;
      text-align: center;
    }

    #player { width: 100%; height: 100%; }
    #player iframe { width: 100%; height: 100%; }

    .sidebar {
      width: 340px;
      min-width: 280px;
      background: #1a1d27;
      border-left: 1px solid #2a2d3a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar h2 {
      padding: 14px 16px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      border-bottom: 1px solid #2a2d3a;
    }

    #timeline {
      overflow-y: auto;
      flex: 1;
    }

    .item {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid #22253a;
      cursor: pointer;
      transition: background 0.1s;
    }

    .item:hover { background: #22263a; }
    .item.active { background: #1e2a4a; border-left: 3px solid #3b5bdb; }

    .item-speaker-toggle {
      margin-left: auto;
      font-size: 0.65rem;
      color: #3b5bdb;
      flex-shrink: 0;
      user-select: none;
    }

    .item-speakers {
      display: none;
      flex-direction: column;
      background: #0d101e;
      border-bottom: 1px solid #22253a;
    }

    .item-speakers.open { display: flex; }

    .speaker-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 6px 16px 6px 36px;
      cursor: pointer;
      border-top: 1px solid #181b2e;
      transition: background 0.1s;
    }

    .speaker-row:hover { background: #141830; }

    .speaker-row-name {
      font-size: 0.8rem;
      color: #bbb;
      flex-shrink: 0;
    }

    .speaker-row-party {
      font-size: 0.7rem;
      color: #555;
    }

    .timeline-search {
      padding: 8px 12px;
      border-bottom: 1px solid #2a2d3a;
    }

    #timeline-search {
      width: 100%;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #3a3d4a;
      background: #0f1117;
      color: #e0e0e0;
      font-size: 0.8rem;
    }

    #timeline-search:focus { outline: none; border-color: #3b5bdb; }
    #timeline-search::placeholder { color: #444; }

    .tl-hidden { display: none !important; }

    .timestamp {
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: #3b82f6;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .item-id {
      font-size: 0.75rem;
      color: #666;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .item-label {
      font-size: 0.85rem;
      color: #ccc;
      line-height: 1.3;
    }

    .item.vote .item-label {
      color: #f59e0b;
    }

    .item.vote .item-id {
      color: #92400e;
    }

    .badge {
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 3px;
      background: #78350f;
      color: #fcd34d;
      flex-shrink: 0;
      align-self: center;
    }

    #login-overlay {
      position: fixed;
      inset: 0;
      background: #0f1117;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #login-box {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 300px;
    }

    #login-box h2 {
      font-size: 1rem;
      color: #fff;
      font-weight: 600;
      margin-bottom: 4px;
    }

    #login-box input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #3a3d4a;
      background: #0f1117;
      color: #e0e0e0;
      font-size: 0.875rem;
      width: 100%;
    }

    #login-box button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      background: #3b5bdb;
      color: #fff;
      font-size: 0.875rem;
      cursor: pointer;
    }

    #login-box button:hover { background: #4c6ef5; }

    #login-error {
      font-size: 0.8rem;
      color: #f87171;
      display: none;
    }

    #share-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #3b5bdb;
      background: #1e2a4a;
      color: #7c9ef8;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #share-btn:hover { background: #253660; border-color: #4c6ef5; color: #a5b4fc; }
    #share-btn.copied { color: #4ade80; border-color: #4ade80; background: #0d2a1a; }
  </style>
</head>
<body>

<div id="login-overlay">
  <div id="login-box">
    <h2>City Council Analyzer</h2>
    <input id="login-user" type="text" placeholder="Username" autocomplete="username" />
    <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" />
    <span id="login-error">Invalid username or password.</span>
    <button onclick="doLogin()">Sign in</button>
  </div>
</div>

<header>
  <h1>City Council Analyzer</h1>
  <select id="session-picker" onchange="onSessionChange()"></select>
  <input id="youtube-input" type="text" readonly />
  <button id="share-btn" onclick="shareCurrentPosition()">🔗 Copy link</button>
</header>

<div class="main">
  <div class="video-panel">
    <div id="player-placeholder">Select a meeting above to load the recording.</div>
    <div id="player-error" style="display:none;color:#f87171;font-size:0.9rem;text-align:center;">No video link available for this session.</div>
    <div id="player"></div>
    <div id="speaker-overlay">
      <div id="speaker-name"></div>
      <div id="speaker-meta"></div>
    </div>
  </div>

  <aside class="sidebar">
    <h2>Timeline</h2>
    <div class="timeline-search">
      <input id="timeline-search" type="text" placeholder="Search…" oninput="filterTimeline(this.value)" />
    </div>
    <div id="timeline"></div>
  </aside>
</div>

<script>
  (function() {
    var overlay = document.getElementById('login-overlay');
    var passInput = document.getElementById('login-pass');

    if (localStorage.getItem('cca_auth') === '1') {
      overlay.style.display = 'none';
    }

    passInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    window.doLogin = function() {
      var user = document.getElementById('login-user').value;
      var pass = document.getElementById('login-pass').value;
      if (user === 'gruene' && pass === 'stadtrat') {
        localStorage.setItem('cca_auth', '1');
        overlay.style.display = 'none';
      } else {
        document.getElementById('login-error').style.display = 'block';
        passInput.value = '';
        passInput.focus();
      }
    };
  })();
</script>

  var player = null;
  var playerReady = false;
  var pendingSeek = null;
  var pendingVideoId = null;

  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    if (pendingVideoId) {
      createPlayer(pendingVideoId);
      pendingVideoId = null;
    }
  }

  function createPlayer(videoId) {
    document.getElementById('player-placeholder').style.display = 'none';
    player = new YT.Player('player', {
      videoId: videoId,
      playerVars: { playsinline: 1, rel: 0, autoplay: 0 },
      events: {
        onReady: function() {
          playerReady = true;
          if (pendingSeek !== null) {
            player.seekTo(pendingSeek, true);
            pendingSeek = null;
          }
          startPlayerTick();
        }
      }
    });
  }

  function loadVideo() {
    var raw = document.getElementById('youtube-input').value.trim();
    if (!raw) return;
    var videoId = extractVideoId(raw);
    if (!videoId) return;
    if (player) {
      player.cueVideoById(videoId);
    } else if (typeof YT !== 'undefined' && YT.Player) {
      createPlayer(videoId);
    } else {
      pendingVideoId = videoId;
    }
  }

  function extractVideoId(url) {
    var m = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : (url.length === 11 ? url : null);
  }

  function seekTo(seconds) {
    if (player && playerReady) {
      player.seekTo(seconds, true);
    } else {
      pendingSeek = seconds;
    }
  }

  function timeToSeconds(t) {
    if (!t) return 0;
    var p = t.split(':');
    return parseInt(p[0]) * 3600 + parseInt(p[1]) * 60 + parseInt(p[2]);
  }

  var activeItem = null;

  // Speaker detection overlay — only active when ?speakers=1 is in the URL
  var SPEAKERS_ENABLED = new URLSearchParams(window.location.search).get('speakers') === '1';
  var currentSpeakerIndex = [];
  var playerTickInterval = null;
  var timelineEntries = [];   // [{seconds, itemEl, speakerListEl, toggleEl}]
  var lastAutoItemEl = null;

  function buildSpeakerIndex(speakers) {
    var index = [];
    if (!speakers || !speakers.length) return index;
    speakers.forEach(function(person) {
      (person.appearances || []).forEach(function(app) {
        index.push({
          start: timeToSeconds(app.start_time),
          end: timeToSeconds(app.end_time),
          name: person.name,
          position: person.position,
          party: person.party
        });
      });
    });
    return index.sort(function(a, b) { return a.start - b.start; });
  }

  function findCurrentSpeakers(index, seconds) {
    var matches = [];
    for (var i = 0; i < index.length; i++) {
      if (index[i].start > seconds + 1) break;
      if (seconds >= index[i].start && seconds <= index[i].end) matches.push(index[i]);
    }
    return matches;
  }

  function updateSpeakerOverlay(seconds) {
    var overlay = document.getElementById('speaker-overlay');
    if (!overlay || !currentSpeakerIndex.length) { if (overlay) overlay.style.display = 'none'; return; }
    var speakers = findCurrentSpeakers(currentSpeakerIndex, seconds);
    if (speakers.length > 0) {
      overlay.innerHTML = speakers.map(function(s) {
        var parts = [s.position, s.party].filter(Boolean);
        return '<div class="speaker-entry">' +
          '<div id="speaker-name">' + s.name + '</div>' +
          (parts.length ? '<div id="speaker-meta">' + parts.join(' · ') + '</div>' : '') +
          '</div>';
      }).join('');
      overlay.style.display = 'block';
    } else {
      overlay.style.display = 'none';
    }
  }

  function updateTimelinePosition(seconds) {
    if (!timelineEntries.length) return;
    var active = timelineEntries[0];
    for (var i = 0; i < timelineEntries.length; i++) {
      if (timelineEntries[i].seconds <= seconds) active = timelineEntries[i];
      else break;
    }
    if (active.itemEl === lastAutoItemEl) return;
    lastAutoItemEl = active.itemEl;
    highlight(active.itemEl);
    active.itemEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    if (active.speakerListEl && !active.speakerListEl.classList.contains('open')) {
      active.speakerListEl.classList.add('open');
      if (active.toggleEl) active.toggleEl.textContent = '▼ ' + active.speakerListEl.children.length;
    }
  }

  function startPlayerTick() {
    if (playerTickInterval) clearInterval(playerTickInterval);
    playerTickInterval = setInterval(function() {
      if (!player || !playerReady) return;
      var sec = Math.floor(player.getCurrentTime());
      if (SPEAKERS_ENABLED && currentSpeakerIndex.length > 0) updateSpeakerOverlay(sec);
      updateTimelinePosition(sec);
    }, 500);
  }

  function stopPlayerTick() {
    if (playerTickInterval) { clearInterval(playerTickInterval); playerTickInterval = null; }
    var overlay = document.getElementById('speaker-overlay');
    if (overlay) overlay.style.display = 'none';
  }

  function highlight(el) {
    if (activeItem) activeItem.classList.remove('active');
    activeItem = el;
    el.classList.add('active');
  }

  function makeItem(seconds, id, label, isVote) {
    var timeStr = new Date(seconds * 1000).toISOString().substr(11, 8);
    var el = document.createElement('div');
    el.className = 'item' + (isVote ? ' vote' : '');
    el.innerHTML =
      '<span class="timestamp">' + timeStr + '</span>' +
      (isVote ? '<span class="badge">vote</span>' : '') +
      '<span class="item-id">' + id + '</span>' +
      '<span class="item-label">' + label + '</span>';
    el.addEventListener('click', function() { seekTo(seconds); highlight(el); });
    return el;
  }

  function buildTimeline(discussions, votes) {
    var entries = [];

    discussions.forEach(function(d) {
      var id = (d.id || '').trim();
      var title = (d.title || '').trim();
      if (id.toUpperCase().startsWith('ABSTIMMUNG')) return;
      entries.push({
        seconds: timeToSeconds(d.start_time),
        endSeconds: d.end_time ? timeToSeconds(d.end_time) : 0,
        id: id,
        label: title || '—',
        isVote: false
      });
    });

    votes.forEach(function(v) {
      var id = (v.id || '').trim();
      entries.push({
        seconds: timeToSeconds(v.end_time),
        id: id,
        label: 'Abstimmung',
        isVote: true
      });
    });

    entries.sort(function(a, b) { return a.seconds - b.seconds; });

    var timeline = document.getElementById('timeline');
    timeline.innerHTML = '';
    activeItem = null;
    timelineEntries = [];
    lastAutoItemEl = null;
    entries.forEach(function(e, i) {
      var itemEl = makeItem(e.seconds, e.id, e.label, e.isVote);
      timeline.appendChild(itemEl);

      var entryRef = { seconds: e.seconds, itemEl: itemEl, speakerListEl: null, toggleEl: null };
      timelineEntries.push(entryRef);

      var speakerText = '';
      if (SPEAKERS_ENABLED && !e.isVote && currentSpeakerIndex.length > 0) {
        var rangeEnd = (e.endSeconds && e.endSeconds > e.seconds)
          ? e.endSeconds
          : (i + 1 < entries.length ? entries[i + 1].seconds : e.seconds + 7200);
        var speakers = speakersInRange(e.seconds, rangeEnd);
        if (speakers.length > 0) {
          speakerText = speakers.map(function(s) { return s.name + ' ' + (s.party || ''); }).join(' ');

          var toggle = document.createElement('span');
          toggle.className = 'item-speaker-toggle';
          toggle.textContent = '▶ ' + speakers.length;
          itemEl.appendChild(toggle);

          var speakerList = makeSpeakerList(speakers);
          timeline.appendChild(speakerList);

          entryRef.speakerListEl = speakerList;
          entryRef.toggleEl = toggle;

          itemEl.addEventListener('click', function() {
            var open = speakerList.classList.toggle('open');
            toggle.textContent = (open ? '▼ ' : '▶ ') + speakers.length;
          });
        }
      }
      itemEl.dataset.search = (e.id + ' ' + e.label + ' ' + speakerText).toLowerCase();
    });

    var first = timeline.querySelector('.item');
    if (first) first.click();
  }

  function filterTimeline(query) {
    var q = query.trim().toLowerCase();
    document.querySelectorAll('#timeline .item').forEach(function(item) {
      var match = !q || (item.dataset.search || '').indexOf(q) !== -1;
      item.classList.toggle('tl-hidden', !match);
      var next = item.nextElementSibling;
      if (next && next.classList.contains('item-speakers')) {
        next.classList.toggle('tl-hidden', !match);
      }
    });
  }

  function speakersInRange(startSec, endSec) {
    var seen = {};
    var result = [];
    for (var i = 0; i < currentSpeakerIndex.length; i++) {
      var a = currentSpeakerIndex[i];
      if (a.start > endSec) break;
      if (a.end >= startSec && a.start <= endSec && !seen[a.name]) {
        seen[a.name] = true;
        result.push({ name: a.name, party: a.party, firstAppearance: a.start });
      }
    }
    return result;
  }

  function makeSpeakerList(speakers) {
    var div = document.createElement('div');
    div.className = 'item-speakers';
    speakers.forEach(function(s) {
      var row = document.createElement('div');
      row.className = 'speaker-row';
      row.innerHTML = '<span class="speaker-row-name">' + s.name + '</span>' +
        (s.party ? '<span class="speaker-row-party">' + s.party + '</span>' : '');
      row.addEventListener('click', function(e) {
        e.stopPropagation();
        seekTo(s.firstAppearance);
      });
      div.appendChild(row);
    });
    return div;
  }

  function shareCurrentPosition() {
    var sessionId = document.getElementById('session-picker').value;
    var t = (player && playerReady) ? Math.floor(player.getCurrentTime()) : 0;
    var url = window.location.origin + window.location.pathname +
      '?session=' + encodeURIComponent(sessionId) + '&t=' + t;
    var btn = document.getElementById('share-btn');
    function flash() {
      btn.textContent = '✓ Copied!';
      btn.classList.add('copied');
      setTimeout(function() { btn.textContent = '🔗 Copy link'; btn.classList.remove('copied'); }, 1500);
    }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(flash).catch(function() { window.prompt('Copy link:', url); });
    } else {
      window.prompt('Copy link:', url);
    }
  }

  function onSessionChange() {
    var id = document.getElementById('session-picker').value;
    if (!id) return;
    if (id === '__newer__') { renderPage(currentPage - 1); picker.value = sessionIds[currentPage * PAGE_SIZE]; onSessionChange(); return; }
    if (id === '__older__') { renderPage(currentPage + 1); picker.value = sessionIds[currentPage * PAGE_SIZE]; onSessionChange(); return; }

    var session = SESSIONS_DATA[id];
    if (!session) return;

    var errorEl = document.getElementById('player-error');
    if (session.youtube_url) {
      errorEl.style.display = 'none';
      var vid = extractVideoId(session.youtube_url);
      document.getElementById('youtube-input').value = vid ? 'youtu.be/' + vid : session.youtube_url;
      loadVideo();
    } else {
      errorEl.style.display = 'block';
      document.getElementById('player-placeholder').style.display = 'none';
    }

    currentSpeakerIndex = SPEAKERS_ENABLED ? buildSpeakerIndex(session.speakers || []) : [];

    var searchEl = document.getElementById('timeline-search');
    if (searchEl) searchEl.value = '';

    buildTimeline(session.discussions, session.votes);

    if (playerReady) startPlayerTick();
  }

  // Populate session picker and apply URL params (?session=&t=)
  var MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var PAGE_SIZE = 5;

  function formatTitle(title) {
    var m = title.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return title + ' – ' + MONTH_ABBR[parseInt(m[2], 10) - 1];
    return title;
  }

  function makeOption(id) {
    var opt = document.createElement('option');
    opt.value = id;
    opt.textContent = formatTitle(SESSIONS_DATA[id].title);
    return opt;
  }

  var picker = document.getElementById('session-picker');
  // Newest first
  var sessionIds = Object.keys(SESSIONS_DATA).reverse();
  var currentPage = 0;

  function renderPage(page) {
    var total = sessionIds.length;
    var start = page * PAGE_SIZE;
    var end = Math.min(start + PAGE_SIZE, total);
    picker.innerHTML = '';
    if (start > 0) {
      var newerOpt = document.createElement('option');
      newerOpt.value = '__newer__';
      newerOpt.textContent = '▴ Newer…';
      picker.appendChild(newerOpt);
    }
    for (var i = start; i < end; i++) {
      picker.appendChild(makeOption(sessionIds[i]));
    }
    if (end < total) {
      var olderOpt = document.createElement('option');
      olderOpt.value = '__older__';
      olderOpt.textContent = '▾ Older…';
      picker.appendChild(olderOpt);
    }
    currentPage = page;
  }

  if (sessionIds.length === 0) {
    picker.style.display = 'none';
  } else {
    renderPage(0);
    var urlParams = new URLSearchParams(window.location.search);
    var sessionParam = urlParams.get('session');
    var tParam = parseInt(urlParams.get('t') || '0') || 0;
    if (sessionParam && SESSIONS_DATA[sessionParam]) {
      var idx = sessionIds.indexOf(sessionParam);
      if (idx >= 0) renderPage(Math.floor(idx / PAGE_SIZE));
      picker.value = sessionParam;
    }
    onSessionChange();
    if (tParam) { seekTo(tParam); }
  }
</script>
