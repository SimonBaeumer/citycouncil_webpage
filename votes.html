<script>
  (function() {
    var overlay = document.getElementById('login-overlay');
    var passInput = document.getElementById('login-pass');

    if (localStorage.getItem('cca_auth') === '1') {
      overlay.style.display = 'none';
    }

    passInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    window.doLogin = function() {
      var user = document.getElementById('login-user').value;
      var pass = document.getElementById('login-pass').value;
      if (user === 'gruene' && pass === 'stadtrat') {
        localStorage.setItem('cca_auth', '1');
        overlay.style.display = 'none';
      } else {
        document.getElementById('login-error').style.display = 'block';
        passInput.value = '';
        passInput.focus();
      }
    };
  })();
</script>

  // Vote codes, as emitted by build_votes_data().
  var ABSENT = 0, JA = 1, NEIN = 2, ENTH = 3, NO_VOTE = 4;
  var CODE_LABEL = ['abwesend', 'Ja', 'Nein', 'Enthaltung', 'ohne Stimme'];
  var CODE_CLASS = ['v-absent', 'v-ja', 'v-nein', 'v-enth', 'v-none'];

  var VOTES_BY_KEY = {};
  DATA.votes.forEach(function(v) { VOTES_BY_KEY[v.key] = v; });

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function personName(pid) {
    var p = DATA.persons[pid];
    return p ? p.name : pid;
  }

  /** The Fraktion printed on this vote's screen, which may predate a change. */
  function rowGroup(row) {
    if (row.length > 2 && row[2]) return row[2];
    var p = DATA.persons[row[0]];
    return p ? p.group : '';
  }

  function findRow(vote, pid) {
    for (var i = 0; i < vote.rows.length; i++) {
      if (vote.rows[i][0] === pid) return vote.rows[i];
    }
    return null;
  }

  /** Ja/Nein/Enthaltung counts for one Fraktion within one vote. */
  function groupSplit(vote, group) {
    var s = { ja: 0, nein: 0, enthaltung: 0, none: 0, absent: 0, total: 0 };
    vote.rows.forEach(function(row) {
      if (rowGroup(row) !== group) return;
      s.total++;
      if (row[1] === JA) s.ja++;
      else if (row[1] === NEIN) s.nein++;
      else if (row[1] === ENTH) s.enthaltung++;
      else if (row[1] === NO_VOTE) s.none++;
      else s.absent++;
    });
    return s;
  }

  function formatSeconds(sec) {
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function videoHref(vote) {
    return 'index.html?session=' + encodeURIComponent(vote.session) + '&t=' + vote.start_sec;
  }

  function tallyBar(vote) {
    var t = vote.tally;
    var total = t.ja + t.nein + t.enthaltung;
    function pct(n) { return total ? (n / total * 100).toFixed(2) + '%' : '0%'; }
    return '<span class="bar">' +
      '<span class="b-ja" style="width:' + pct(t.ja) + '"></span>' +
      '<span class="b-nein" style="width:' + pct(t.nein) + '"></span>' +
      '<span class="b-enth" style="width:' + pct(t.enthaltung) + '"></span>' +
      '</span><span class="tally-nums">' +
      '<b class="v-ja">' + t.ja + '</b> / <b class="v-nein">' + t.nein + '</b>' +
      ' / <b class="v-enth">' + t.enthaltung + '</b></span>';
  }

  function chip(code) {
    return '<span class="chip ' + CODE_CLASS[code] + '">' + CODE_LABEL[code] + '</span>';
  }

  // ---------------------------------------------------------------- routing

  function parseHash() {
    var raw = location.hash.replace(/^#/, '') || '/';
    var qi = raw.indexOf('?');
    var path = qi >= 0 ? raw.slice(0, qi) : raw;
    var params = new URLSearchParams(qi >= 0 ? raw.slice(qi + 1) : '');
    return { path: path, params: params };
  }

  function listHref(params) {
    var qs = params.toString();
    return '#/' + (qs ? '?' + qs : '');
  }

  function personHref(pid) { return '#/person/' + encodeURIComponent(pid); }
  function voteHref(key) { return '#/vote/' + encodeURIComponent(key); }

  function route() {
    var r = parseHash();
    var parts = r.path.split('/').filter(function(p) { return p !== ''; });
    if (parts[0] === 'vote' && parts[1]) {
      var vote = VOTES_BY_KEY[decodeURIComponent(parts[1])];
      if (vote) return renderVote(vote);
    } else if (parts[0] === 'person' && parts[1]) {
      var pid = decodeURIComponent(parts[1]);
      if (DATA.persons[pid]) return renderPerson(pid);
    }
    renderList(r.params);
  }

  // ------------------------------------------------------------- list view

  function renderList(params) {
    var query = (params.get('q') || '').trim().toLowerCase();
    var group = params.get('group') || '';
    var person = params.get('person') || '';
    var session = params.get('session') || '';
    if (person && !DATA.persons[person]) person = '';
    if (DATA.groups.indexOf(group) === -1) group = '';
    if (!DATA.sessions[session]) session = '';

    var matches = DATA.votes.filter(function(v) {
      if (session && v.session !== session) return false;
      if (!query) return true;
      var hay = (v.agenda + ' ' + v.reference + ' ' + v.title).toLowerCase();
      return hay.indexOf(query) !== -1;
    });

    var html = '<div class="filters">' +
      '<input id="f-query" type="text" placeholder="Vorlage, Antrag oder TOP suchen…" value="' + esc(params.get('q') || '') + '" />' +
      selectHtml('f-session', 'Alle Sitzungen', Object.keys(DATA.sessions).sort().reverse().map(function(s) {
        return { value: s, label: DATA.sessions[s].title };
      }), session) +
      selectHtml('f-group', 'Alle Fraktionen', DATA.groups.map(function(g) {
        return { value: g, label: g };
      }), group) +
      personSelectHtml(person) +
      '</div>';

    html += '<div class="result-count">' + matches.length + ' von ' + DATA.votes.length +
      ' Abstimmungen</div>';

    if (!matches.length) {
      html += '<div class="empty">Keine Abstimmung gefunden.</div>';
    } else {
      html += '<table><thead><tr>' +
        '<th class="col-date">Datum</th><th class="col-top">TOP</th>' +
        '<th class="col-ref">Vorlage</th><th>Titel</th>' +
        (person ? '<th>' + esc(personName(person)) + '</th>' : '') +
        (group ? '<th>' + esc(group) + '</th>' : '') +
        '<th class="col-result">Ergebnis</th></tr></thead><tbody>';

      matches.forEach(function(v) {
        var cells = '<td class="col-date">' + esc(DATA.sessions[v.session].title) + '</td>' +
          '<td class="col-top">' + esc(v.agenda) + '</td>' +
          '<td class="col-ref">' + (v.vorlage
            ? '<a href="' + esc(v.vorlage) + '" target="_blank" rel="noopener noreferrer">' + esc(v.reference) + ' ↗</a>'
            : esc(v.reference)) + '</td>' +
          '<td class="col-title">' + esc(v.title) + '</td>';

        if (person) {
          var row = findRow(v, person);
          cells += '<td>' + (row ? chip(row[1]) : '<span class="v-absent">nicht erfasst</span>') + '</td>';
        }
        if (group) {
          var s = groupSplit(v, group);
          cells += '<td class="tally-nums"><b class="v-ja">' + s.ja + '</b> / <b class="v-nein">' +
            s.nein + '</b> / <b class="v-enth">' + s.enthaltung + '</b></td>';
        }
        cells += '<td class="col-result">' + tallyBar(v) + '</td>';
        html += '<tr data-key="' + esc(v.key) + '">' + cells + '</tr>';
      });
      html += '</tbody></table>';
    }

    var view = document.getElementById('view');
    view.innerHTML = html;

    view.querySelectorAll('tbody tr').forEach(function(tr) {
      tr.addEventListener('click', function(e) {
        if (e.target.closest('a')) return;
        location.hash = voteHref(tr.dataset.key);
      });
    });

    wireFilters(params);
  }

  function selectHtml(id, placeholder, options, selected) {
    var html = '<select id="' + id + '"><option value="">' + placeholder + '</option>';
    options.forEach(function(o) {
      html += '<option value="' + esc(o.value) + '"' +
        (o.value === selected ? ' selected' : '') + '>' + esc(o.label) + '</option>';
    });
    return html + '</select>';
  }

  function personSelectHtml(selected) {
    var byGroup = {};
    Object.keys(DATA.persons).forEach(function(pid) {
      var g = DATA.persons[pid].group || 'ohne Fraktion';
      (byGroup[g] = byGroup[g] || []).push(pid);
    });
    var html = '<select id="f-person"><option value="">Alle Mitglieder</option>';
    Object.keys(byGroup).sort().forEach(function(g) {
      html += '<optgroup label="' + esc(g) + '">';
      byGroup[g].sort(function(a, b) {
        return personName(a).localeCompare(personName(b), 'de');
      }).forEach(function(pid) {
        html += '<option value="' + esc(pid) + '"' + (pid === selected ? ' selected' : '') +
          '>' + esc(personName(pid)) + '</option>';
      });
      html += '</optgroup>';
    });
    return html + '</select>';
  }

  function wireFilters(params) {
    function update(key, value) {
      var next = new URLSearchParams(params.toString());
      if (value) next.set(key, value); else next.delete(key);
      location.hash = listHref(next);
    }

    var q = document.getElementById('f-query');
    var timer = null;
    q.addEventListener('input', function() {
      clearTimeout(timer);
      timer = setTimeout(function() {
        var pos = q.selectionStart;
        update('q', q.value.trim());
        var again = document.getElementById('f-query');
        if (again) { again.focus(); again.setSelectionRange(pos, pos); }
      }, 200);
    });

    [['f-session', 'session'], ['f-group', 'group'], ['f-person', 'person']].forEach(function(pair) {
      document.getElementById(pair[0]).addEventListener('change', function() {
        update(pair[1], this.value);
      });
    });
  }

  // ------------------------------------------------------------- vote view

  function renderVote(vote) {
    var t = vote.tally;
    var html = '<a class="back" href="' + listHref(new URLSearchParams()) + '">← Alle Abstimmungen</a>' +
      '<div class="detail-head">' +
      '<h2>' + esc(vote.title || vote.agenda) + '</h2>' +
      '<div class="detail-meta">' +
      '<span>' + esc(DATA.sessions[vote.session].title) + '</span>' +
      '<span>TOP ' + esc(vote.agenda) + '</span>' +
      (vote.reference ? '<span>' + esc(vote.reference) + '</span>' : '') +
      '<span>' + formatSeconds(vote.start_sec) + '</span>' +
      '</div></div>';

    html += '<div class="detail-actions">';
    if (DATA.sessions[vote.session].video) {
      html += '<a class="action" href="' + videoHref(vote) + '">▶ Im Video ansehen</a>';
    }
    if (vote.vorlage) {
      html += '<a class="action" href="' + esc(vote.vorlage) +
        '" target="_blank" rel="noopener noreferrer">Vorlage im Ratsinformationssystem ↗</a>';
    }
    html += '</div>';

    html += '<div class="summary">' +
      stat(t.ja, 'Ja') + stat(t.nein, 'Nein') + stat(t.enthaltung, 'Enthaltung') +
      stat(vote.cast, 'Abgegeben') + stat(vote.present, 'Anwesend') + '</div>';

    // Two separate guarantees, per voting-analysis.md: the screen's own totals
    // adding up says nothing about whether the vote had finished.
    html += '<div class="quality">' +
      (vote.checksum_ok
        ? '<span class="ok">✓</span> Die Summen des Abstimmungsbildschirms stimmen mit den ausgezählten Stimmen überein.'
        : '<span class="warn">!</span> Die Summen des Abstimmungsbildschirms stimmen nicht mit den ausgezählten Stimmen überein.') +
      '<br />Das Ergebnis war beim Auslesen seit ' + vote.settled_sec + ' s unverändert.' +
      '</div>';

    var groups = {};
    vote.rows.forEach(function(row) {
      var g = rowGroup(row) || 'ohne Fraktion';
      (groups[g] = groups[g] || []).push(row);
    });

    Object.keys(groups).sort().forEach(function(g) {
      var s = groupSplit(vote, g);
      html += '<div class="group-block"><div class="group-head">' +
        '<h3>' + esc(g) + '</h3><span class="split">' +
        '<b class="v-ja">' + s.ja + '</b> Ja · <b class="v-nein">' + s.nein + '</b> Nein · ' +
        '<b class="v-enth">' + s.enthaltung + '</b> Enthaltung</span></div><div class="member-grid">';

      groups[g].sort(function(a, b) {
        return personName(a[0]).localeCompare(personName(b[0]), 'de');
      }).forEach(function(row) {
        html += '<div class="member">' +
          '<a class="mname" href="' + personHref(row[0]) + '">' + esc(personName(row[0])) + '</a>' +
          chip(row[1]) + '</div>';
      });
      html += '</div></div>';
    });

    document.getElementById('view').innerHTML = html;
  }

  function stat(n, label) {
    return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + esc(label) + '</div></div>';
  }

  // ----------------------------------------------------------- person view

  function renderPerson(pid) {
    var person = DATA.persons[pid];
    var counts = [0, 0, 0, 0, 0];
    var withGroup = 0, castTotal = 0;
    var rows = [];

    DATA.votes.forEach(function(v) {
      var row = findRow(v, pid);
      if (!row) return;
      counts[row[1]]++;
      rows.push({ vote: v, code: row[1] });
      if (row[1] === JA || row[1] === NEIN || row[1] === ENTH) {
        castTotal++;
        if (votedWithGroup(v, row)) withGroup++;
      }
    });

    var attended = rows.length - counts[ABSENT];

    var html = '<a class="back" href="' + listHref(new URLSearchParams()) + '">← Alle Abstimmungen</a>' +
      '<div class="detail-head"><h2>' + esc(person.name) + '</h2>' +
      '<div class="detail-meta"><span>' + esc(person.group || 'ohne Fraktion') + '</span>' +
      '<span>' + rows.length + ' erfasste Abstimmungen</span></div></div>';

    if (person.unmatched) {
      html += '<div class="note">Dieser Name konnte keinem Eintrag in persons.json zugeordnet ' +
        'werden. Die Stimmen stammen unverändert vom Abstimmungsbildschirm.</div>';
    }

    html += '<div class="summary">' +
      stat(counts[JA], 'Ja') + stat(counts[NEIN], 'Nein') + stat(counts[ENTH], 'Enthaltung') +
      stat(counts[NO_VOTE], 'Ohne Stimme') + stat(counts[ABSENT], 'Abwesend') +
      stat(attended ? Math.round(castTotal / attended * 100) + '%' : 'n/a', 'Teilnahme') +
      stat(castTotal ? Math.round(withGroup / castTotal * 100) + '%' : 'n/a', 'Fraktionstreue') +
      '</div>';

    html += '<div class="quality">Teilnahme: abgegebene Stimmen von den Abstimmungen, bei denen ' +
      'die Person anwesend war. Fraktionstreue: Anteil der abgegebenen Stimmen, die der Mehrheit ' +
      'der eigenen Fraktion entsprachen.</div>';

    if (!rows.length) {
      html += '<div class="empty">Keine Abstimmungen erfasst.</div>';
    } else {
      html += '<table><thead><tr><th class="col-date">Datum</th><th class="col-top">TOP</th>' +
        '<th class="col-ref">Vorlage</th><th>Titel</th><th>Stimme</th>' +
        '<th class="col-result">Ergebnis</th></tr></thead><tbody>';
      rows.forEach(function(r) {
        var v = r.vote;
        html += '<tr data-key="' + esc(v.key) + '">' +
          '<td class="col-date">' + esc(DATA.sessions[v.session].title) + '</td>' +
          '<td class="col-top">' + esc(v.agenda) + '</td>' +
          '<td class="col-ref">' + (v.vorlage
            ? '<a href="' + esc(v.vorlage) + '" target="_blank" rel="noopener noreferrer">' + esc(v.reference) + ' ↗</a>'
            : esc(v.reference)) + '</td>' +
          '<td class="col-title">' + esc(v.title) + '</td>' +
          '<td>' + chip(r.code) + '</td>' +
          '<td class="col-result">' + tallyBar(v) + '</td></tr>';
      });
      html += '</tbody></table>';
    }

    var view = document.getElementById('view');
    view.innerHTML = html;
    view.querySelectorAll('tbody tr').forEach(function(tr) {
      tr.addEventListener('click', function(e) {
        if (e.target.closest('a')) return;
        location.hash = voteHref(tr.dataset.key);
      });
    });
  }

  /** Did this row match the most common cast vote in its own Fraktion?
      A tie counts as a match: the person is with a plurality either way. */
  function votedWithGroup(vote, row) {
    var s = groupSplit(vote, rowGroup(row));
    var mine = row[1] === JA ? s.ja : (row[1] === NEIN ? s.nein : s.enthaltung);
    return mine >= Math.max(s.ja, s.nein, s.enthaltung);
  }

  window.addEventListener('hashchange', route);
  route();
</script>

</body>
</html>
