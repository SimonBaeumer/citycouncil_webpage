<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abstimmungen | City Council Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
    }

    a { color: #7c9ef8; text-decoration: none; }
    a:hover { text-decoration: underline; }

    #login-overlay {
      position: fixed;
      inset: 0;
      background: #0f1117;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #login-box {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 280px;
    }

    #login-box h2 { font-size: 1rem; color: #fff; margin-bottom: 6px; }

    #login-box input {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #3a3d4a;
      background: #0f1117;
      color: #e0e0e0;
      font-size: 0.9rem;
    }

    #login-box button {
      margin-top: 6px;
      padding: 8px 10px;
      border-radius: 6px;
      border: none;
      background: #3b5bdb;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
    }

    #login-box button:hover { background: #4c6ef5; }

    #login-error {
      display: none;
      color: #f87171;
      font-size: 0.8rem;
    }

    header {
      padding: 12px 20px;
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header h1 { font-size: 1rem; font-weight: 600; color: #fff; white-space: nowrap; }

    .site-nav { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
    .site-nav a {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #3b5bdb;
      background: #1e2a4a;
      color: #7c9ef8;
      font-size: 0.875rem;
      white-space: nowrap;
    }
    .site-nav a:hover { background: #253660; text-decoration: none; }
    .site-nav a.active { background: #3b5bdb; color: #fff; }

    /* Wide tables scroll inside their own box instead of the whole page. */
    .table-wrap { overflow-x: auto; }

    main { max-width: 1180px; margin: 0 auto; padding: 20px; }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filters input, .filters select {
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #2a2d3a;
      background: #1a1d27;
      color: #e0e0e0;
      font-size: 0.875rem;
    }
    .filters input:focus, .filters select:focus { outline: none; border-color: #3b5bdb; }
    #f-query { flex: 1; min-width: 220px; }

    .result-count { font-size: 0.8rem; color: #666; margin-bottom: 10px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }

    th {
      text-align: left;
      padding: 8px 10px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      border-bottom: 1px solid #2a2d3a;
      white-space: nowrap;
    }

    td { padding: 9px 10px; border-bottom: 1px solid #1e212b; vertical-align: top; }

    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #171a23; }

    .col-date, .col-top, .col-ref { white-space: nowrap; color: #9aa0ad; }
    .col-ref a { font-family: ui-monospace, monospace; font-size: 0.8rem; }
    .col-title { color: #e0e0e0; }
    .col-result { white-space: nowrap; }

    .bar {
      display: inline-flex;
      width: 120px;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      background: #2a2d3a;
      vertical-align: middle;
      margin-right: 8px;
    }
    .bar span { display: block; height: 100%; }
    .bar .b-ja { background: #4ade80; }
    .bar .b-nein { background: #f87171; }
    .bar .b-enth { background: #fbbf24; }

    .tally-nums { font-size: 0.8rem; color: #9aa0ad; }
    .tally-nums b { color: #e0e0e0; font-weight: 600; }

    .v-ja { color: #4ade80; }
    .v-nein { color: #f87171; }
    .v-enth { color: #fbbf24; }
    .v-none { color: #9ca3af; }
    .v-absent { color: #5b6170; }

    .chip {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 0.75rem;
      border: 1px solid currentColor;
      white-space: nowrap;
    }

    .empty { padding: 40px 10px; color: #666; text-align: center; }

    .back { display: inline-block; margin-bottom: 14px; font-size: 0.85rem; }

    .detail-head { margin-bottom: 18px; }
    .detail-head h2 { font-size: 1.15rem; color: #fff; margin-bottom: 6px; line-height: 1.35; }
    .detail-meta { font-size: 0.85rem; color: #9aa0ad; display: flex; gap: 14px; flex-wrap: wrap; }

    .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
    .action {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #3b5bdb;
      background: #1e2a4a;
      color: #7c9ef8;
      font-size: 0.85rem;
    }
    .action:hover { background: #253660; text-decoration: none; }

    .summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    .stat {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      padding: 10px 14px;
      min-width: 96px;
    }
    .stat .n { font-size: 1.3rem; font-weight: 600; color: #fff; }
    .stat .l { font-size: 0.72rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }

    .quality { font-size: 0.78rem; color: #777; margin-top: 10px; line-height: 1.6; }
    .quality .ok { color: #4ade80; }
    .quality .warn { color: #fbbf24; }

    .group-block { margin-top: 22px; }
    .group-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2a2d3a;
      margin-bottom: 8px;
    }
    .group-head h3 { font-size: 0.9rem; color: #fff; }
    .group-head .split { font-size: 0.8rem; color: #9aa0ad; }

    .member-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 4px 16px;
    }
    .member {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      font-size: 0.85rem;
    }
    .member .mname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .note { font-size: 0.8rem; color: #fbbf24; margin-top: 8px; }

    /* ---- appearances (person view) ---- */

    .section-toggle {
      margin-left: auto;
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid #2a2d3a;
      background: #1a1d27;
      color: #9aa0ad;
      font-size: 0.75rem;
      font-family: inherit;
      cursor: pointer;
    }
    .section-toggle:hover { border-color: #3b5bdb; color: #7c9ef8; }

    .speech-session { margin-top: 12px; }
    .speech-session h4 {
      font-size: 0.78rem;
      font-weight: 600;
      color: #9aa0ad;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .speech-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 6px 12px;
    }

    .speech {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      background: #161923;
      color: #e0e0e0;
      font-size: 0.85rem;
    }
    .speech:hover { border-color: #3b5bdb; background: #1b2032; text-decoration: none; }
    .speech-time { font-variant-numeric: tabular-nums; color: #7c9ef8; white-space: nowrap; }
    .speech-dur { font-variant-numeric: tabular-nums; color: #e0e0e0; white-space: nowrap; }
    .speech-cam {
      font-size: 0.75rem;
      color: #777;
      margin-left: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .speech-open { color: #666; font-size: 0.8rem; }
    .speech:hover .speech-open { color: #7c9ef8; }
    .speech.podium .speech-time { color: #4ade80; }

    /* Short appearances, and any session that holds nothing else, stay out of
       the way until the toggle asks for them. */
    .speech.short { display: none; }
    .speech-session.all-short { display: none; }
    #view.show-short .speech.short { display: flex; }
    #view.show-short .speech-session.all-short { display: block; }

    .speech-topic {
      font-size: 0.75rem;
      color: #9aa0ad;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .result-label { font-size: 0.75rem; margin-left: 6px; }

    /* ---- members overview ---- */

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }

    .card {
      display: block;
      padding: 10px 12px;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      background: #161923;
      color: #e0e0e0;
      min-width: 0;
    }
    .card:hover { border-color: #3b5bdb; background: #1b2032; text-decoration: none; }
    .card-name { font-weight: 600; color: #fff; font-size: 0.92rem; }
    .card-line {
      font-size: 0.78rem;
      color: #9aa0ad;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-stats { font-size: 0.78rem; color: #c0c4cc; margin-top: 6px; }
    .card-stats b { color: #fff; font-weight: 600; }

    .gaps { margin-top: 26px; font-size: 0.82rem; color: #9aa0ad; }
    .gaps summary { cursor: pointer; color: #fbbf24; }
    .gaps h4 { font-size: 0.8rem; color: #e0e0e0; margin: 12px 0 4px; }
    .gaps ul { margin-left: 18px; line-height: 1.6; }

    @media (max-width: 640px) {
      .col-ref, .col-date { display: none; }
      main { padding: 12px; }
      header { padding: 10px 12px; }
      .site-nav { margin-left: 0; }
      .filters select, .filters input { flex: 1 1 140px; min-width: 0; }
      .bar { width: 60px; }
    }
  </style>
</head>
<body>

<div id="login-overlay">
  <div id="login-box">
    <h2>City Council Analyzer</h2>
    <input id="login-user" type="text" placeholder="Username" autocomplete="username" />
    <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" />
    <span id="login-error">Invalid username or password.</span>
    <button onclick="doLogin()">Sign in</button>
  </div>
</div>

<header>
  <h1 id="page-title">Abstimmungen</h1>
  <nav class="site-nav">
    <a href="index.html">Sitzungen</a>
    <a href="#/abstimmungen" data-nav="abstimmungen">Abstimmungen</a>
    <a href="#/mitglieder" data-nav="mitglieder">Mitglieder</a>
    <a href="#/redner" data-nav="redner">Redner</a>
  </nav>
</header>

<main id="view"></main>

<script>
  (function() {
    var overlay = document.getElementById('login-overlay');
    var passInput = document.getElementById('login-pass');

    if (localStorage.getItem('cca_auth') === '1') {
      overlay.style.display = 'none';
    }

    passInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    window.doLogin = function() {
      var user = document.getElementById('login-user').value;
      var pass = document.getElementById('login-pass').value;
      if (user === 'gruene' && pass === 'stadtrat') {
        localStorage.setItem('cca_auth', '1');
        overlay.style.display = 'none';
      } else {
        document.getElementById('login-error').style.display = 'block';
        passInput.value = '';
        passInput.focus();
      }
    };
  })();
</script>

    var html = '<div class="filters">' +
      '<input id="f-query" type="text" placeholder="Vorlage, Antrag oder TOP suchen…" value="' + esc(query) + '" />' +
      selectHtml('f-session', 'Alle Sitzungen', VOTE_SESSIONS.map(function(s) {
        return { value: s, label: DATA.sessions[s].title };
      }), session) +
      personSelectHtml(person) +
      (person ? selectHtml('f-vote', 'Jede Stimme', VOTE_FILTERS, voteFilter) : '') +
      selectHtml('f-group', 'Alle Fraktionen', DATA.groups.map(function(g) {
        return { value: g, label: g };
      }), group) +
      selectHtml('f-result', 'Jedes Ergebnis', RESULT_FILTERS, result) +
      selectHtml('f-sort', '', VOTE_SORTS, sort, true) +
      '</div>';

    html += '<div class="result-count">' + matches.length + ' von ' + DATA.votes.length +
      ' Abstimmungen</div>';

    if (!matches.length) {
      html += '<div class="empty">Keine Abstimmung gefunden.</div>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr>' +
        '<th class="col-date">Datum</th><th class="col-top">TOP</th>' +
        '<th class="col-ref">Vorlage</th><th>Titel</th>' +
        (person ? '<th>' + esc(personName(person)) + '</th>' : '') +
        (group ? '<th>' + esc(group) + '</th>' : '') +
        '<th class="col-result">Ergebnis</th></tr></thead><tbody>';

      matches.forEach(function(v) {
        var cells = '<td class="col-date">' + esc(DATA.sessions[v.session].title) + '</td>' +
          '<td class="col-top">' + esc(v.agenda) + '</td>' +
          '<td class="col-ref">' + (v.vorlage
            ? '<a href="' + esc(v.vorlage) + '" target="_blank" rel="noopener noreferrer">' + esc(v.reference) + ' ↗</a>'
            : esc(v.reference)) + '</td>' +
          '<td class="col-title">' + esc(v.title) + '</td>';

        if (person) {
          var row = findRow(v, person);
          cells += '<td>' + (row ? chip(row[1]) : '<span class="v-absent">nicht erfasst</span>') + '</td>';
        }
        if (group) {
          var s = groupSplit(v, group);
          cells += '<td class="tally-nums"><b class="v-ja">' + s.ja + '</b> / <b class="v-nein">' +
            s.nein + '</b> / <b class="v-enth">' + s.enthaltung + '</b></td>';
        }
        cells += '<td class="col-result">' + tallyBar(v) + resultLabel(v) + '</td>';
        html += '<tr data-key="' + esc(v.key) + '">' + cells + '</tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '<div class="quality">„Angenommen“ heißt hier: mehr Ja- als Nein-Stimmen. Bei ' +
      'Stimmengleichheit gilt ein Antrag als abgelehnt; ob eine Vorlage eine qualifizierte ' +
      'Mehrheit brauchte, zeigt der Abstimmungsbildschirm nicht.</div>';

    var view = document.getElementById('view');
    view.innerHTML = html;

    view.querySelectorAll('tbody tr').forEach(function(tr) {
      tr.addEventListener('click', function(e) {
        if (e.target.closest('a')) return;
        location.hash = voteHref(tr.dataset.key);
      });
    });

    wireFilters(params, listHref, [
      ['f-session', 'session'], ['f-person', 'person'], ['f-vote', 'vote'],
      ['f-group', 'group'], ['f-result', 'result'], ['f-sort', 'sort']
    ]);
  }

  /** A <select>; `placeholder` is the empty "no filter" option, left out
      when `noEmpty` is set (a sort order always has a value). */
  function selectHtml(id, placeholder, options, selected, noEmpty) {
    var html = '<select id="' + id + '">' +
      (noEmpty ? '' : '<option value="">' + esc(placeholder) + '</option>');
    options.forEach(function(o) {
      html += '<option value="' + esc(o.value) + '"' +
        (o.value === selected ? ' selected' : '') + '>' + esc(o.label) + '</option>';
    });
    return html + '</select>';
  }

  function personSelectHtml(selected) {
    var byGroup = {};
    // Only people who appear on a voting screen: the filter adds a column of
    // their votes, which for a Bürgermeister would read "nicht erfasst" all the
    // way down. Their appearances are reachable from the Redner list instead.
    Object.keys(DATA.persons).forEach(function(pid) {
      if (!DATA.persons[pid].voted) return;
      var g = DATA.persons[pid].group || 'ohne Fraktion';
      (byGroup[g] = byGroup[g] || []).push(pid);
    });
    var html = '<select id="f-person"><option value="">Alle Mitglieder</option>';
    Object.keys(byGroup).sort().forEach(function(g) {
      html += '<optgroup label="' + esc(g) + '">';
      byGroup[g].sort(function(a, b) {
        return personName(a).localeCompare(personName(b), 'de');
      }).forEach(function(pid) {
        html += '<option value="' + esc(pid) + '"' + (pid === selected ? ' selected' : '') +
          '>' + esc(personName(pid)) + '</option>';
      });
      html += '</optgroup>';
    });
    return html + '</select>';
  }

  /** Every filter lives in the URL, so a filtered view is a shareable link.
      `pairs` maps element ids to query keys; missing elements are skipped. */
  function wireFilters(params, hrefFor, pairs) {
    function update(key, value) {
      var next = new URLSearchParams(params.toString());
      if (value) next.set(key, value); else next.delete(key);
      location.hash = hrefFor(next);
    }

    var q = document.getElementById('f-query');
    var timer = null;
    q.addEventListener('input', function() {
      clearTimeout(timer);
      timer = setTimeout(function() {
        var pos = q.selectionStart;
        update('q', q.value.trim());
        var again = document.getElementById('f-query');
        if (again) { again.focus(); again.setSelectionRange(pos, pos); }
      }, 200);
    });

    pairs.forEach(function(pair) {
      var el = document.getElementById(pair[0]);
      if (!el) return;
      el.addEventListener('change', function() {
        update(pair[1], this.value);
      });
    });
  }

  // ---------------------------------------------------------- members view

  function renderMembers(params) {
    var query = (params.get('q') || '').trim();
    var party = params.get('partei') || '';
    var group = params.get('fraktion') || '';
    var kind = params.get('gremium') || 'rat';
    var sort = params.get('sort') || 'name';
    if (!KINDS.some(function(k) { return k.value === kind; })) kind = 'rat';
    if (!MEMBER_SORTS.some(function(o) { return o.value === sort; })) sort = 'name';
    if (DATA.groups.indexOf(group) === -1) group = '';

    var inKind = Object.keys(DATA.persons).filter(function(pid) {
      return kind === 'alle' || DATA.persons[pid].kind === kind;
    });

    // Only the parties somebody in the chosen Gremium belongs to: the
    // Ortschaften bring a handful of local lists nobody in the Stadtrat has.
    var parties = (DATA.parties || []).filter(function(name) {
      return inKind.some(function(pid) { return DATA.persons[pid].party === name; });
    });
    if (parties.indexOf(party) === -1) party = '';

    var speech = {};
    inKind.forEach(function(pid) { speech[pid] = appearanceStats(pid); });

    var matches = inKind.filter(function(pid) {
      var p = DATA.persons[pid];
      if (party && p.party !== party) return false;
      // The Fraktion is the one the voting screen prints, so it only exists
      // for people who vote.
      if (group && !(p.voted && p.group === group)) return false;
      return !query || matchesQuery(p.name, query);
    });

    var sorters = {
      name: byName,
      partei: function(a, b) {
        return (DATA.persons[a].party || '~').localeCompare(DATA.persons[b].party || '~', 'de') || byName(a, b);
      },
      fraktion: function(a, b) {
        return memberGroup(a).localeCompare(memberGroup(b), 'de') || byName(a, b);
      },
      stimmen: function(a, b) { return castCount(b) - castCount(a) || byName(a, b); },
      auftritte: function(a, b) { return speechCount(speech[b]) - speechCount(speech[a]) || byName(a, b); },
      zuletzt: function(a, b) {
        return (DATA.persons[b].last || '').localeCompare(DATA.persons[a].last || '') || byName(a, b);
      }
    };
    matches.sort(sorters[sort]);

    var html = '<div class="filters">' +
      '<input id="f-query" type="text" placeholder="Name suchen…" value="' + esc(query) + '" />' +
      selectHtml('f-kind', '', KINDS, kind, true) +
      selectHtml('f-party', 'Alle Parteien', parties.map(function(name) {
        return { value: name, label: name };
      }), party) +
      selectHtml('f-group', 'Alle Fraktionen', DATA.groups.map(function(g) {
        return { value: g, label: g };
      }), group) +
      selectHtml('f-sort', '', MEMBER_SORTS, sort, true) +
      '</div>';

    html += '<div class="result-count">' + matches.length + ' von ' + inKind.length + ' ' +
      (KINDS.filter(function(k) { return k.value === kind; })[0].label) + '</div>';

    if (!matches.length) {
      html += '<div class="empty">Niemand gefunden.</div>';
    } else {
      html += '<div class="card-grid">';
      matches.forEach(function(pid) {
        var p = DATA.persons[pid];
        var cast = castCount(pid);
        var talks = speechCount(speech[pid]);
        var affiliation = [p.party, p.voted ? p.group : ''].filter(Boolean);
        // A party and a Fraktion that say the same thing ("CDU", "CDU-Fraktion")
        // are shown once.
        if (affiliation.length === 2 && (DATA.group_parties || {})[p.group] === p.party) {
          affiliation = [affiliation[1]];
        }
        html += '<a class="card" href="' + personHref(pid) + '">' +
          '<div class="card-name">' + esc(p.name) + '</div>' +
          '<div class="card-line">' + esc(affiliation.join(' · ') || 'ohne Partei') + '</div>' +
          (p.role ? '<div class="card-line" title="' + esc(p.role) + '">' + esc(p.role) + '</div>' : '') +
          (p.first ? '<div class="card-line">' + esc(periodLabel(p)) + '</div>' : '') +
          '<div class="card-stats">' +
          (p.voted ? '<b>' + cast + '</b> ' + (cast === 1 ? 'Stimme' : 'Stimmen') : 'stimmt nicht ab') +
          ' · <b>' + talks + '</b> ' + (talks === 1 ? 'Auftritt' : 'Auftritte') +
          (speech[pid].podiumLong ? ' (' + speech[pid].podiumLong + ' am Pult)' : '') +
          '</div></a>';
      });
      html += '</div>';
    }

    html += '<div class="quality">Stimmen: abgegebene Ja-, Nein- und Enthaltungsstimmen. ' +
      'Auftritte: Zeiten vor der Kamera ab ' + SHORT_APPEARANCE_SEC + ' s. Der Zeitraum nennt ' +
      'die erste und letzte Sitzung, in der die Person abgestimmt hat oder zu sehen war.</div>';

    html += dataGapsHtml();

    document.getElementById('view').innerHTML = html;
    wireFilters(params, membersHref, [
      ['f-kind', 'gremium'], ['f-party', 'partei'], ['f-group', 'fraktion'], ['f-sort', 'sort']
    ]);
  }

  /** The Fraktion a member votes in; '~' (sorts last) for someone who does not vote. */
  function memberGroup(pid) {
    var p = DATA.persons[pid];
    return p.voted ? p.group || '' : '~';
  }

  /** Appearances long enough to be more than a reaction shot. */
  function speechCount(stats) {
    return stats.count - stats.short;
  }

  /** What the page cannot show, listed instead of failing silently. */
  function dataGapsHtml() {
    var unmatched = Object.keys(DATA.persons).filter(function(pid) {
      return DATA.persons[pid].unmatched;
    }).sort(byName);
    var noVotes = DATA.without_votes || [];

    if (!unmatched.length && !noVotes.length) return '';

    function list(pids) {
      return '<ul>' + pids.map(function(pid) {
        return '<li><a href="' + personHref(pid) + '">' + esc(personName(pid)) + '</a></li>';
      }).join('') + '</ul>';
    }

    var html = '<details class="gaps"><summary>Datenlücken (' +
      (unmatched.length + noVotes.length) + ')</summary>';
    if (unmatched.length) {
      html += '<h4>Namen vom Abstimmungsbildschirm ohne Eintrag in persons.json</h4>' + list(unmatched);
    }
    if (noVotes.length) {
      html += '<h4>Sitzungen mit Aufzeichnung, aber ohne votes.json</h4><ul>' +
        noVotes.map(function(id) {
          return '<li><a href="index.html?session=' + encodeURIComponent(id) + '">' +
            esc((DATA.sessions[id] || { title: id }).title) + '</a></li>';
        }).join('') + '</ul>';
    }
    return html + '</details>';
  }

  // ------------------------------------------------------------- vote view

  function renderVote(vote) {
    var t = vote.tally;
    var html = '<a class="back" href="' + listHref(new URLSearchParams()) + '">← Alle Abstimmungen</a>' +
      '<div class="detail-head">' +
      '<h2>' + esc(vote.title || vote.agenda) + '</h2>' +
      '<div class="detail-meta">' +
      '<span>' + esc(DATA.sessions[vote.session].title) + '</span>' +
      '<span>TOP ' + esc(vote.agenda) + '</span>' +
      (vote.reference ? '<span>' + esc(vote.reference) + '</span>' : '') +
      '<span>' + formatSeconds(vote.start_sec) + '</span>' +
      '</div></div>';

    html += '<div class="detail-actions">';
    if (DATA.sessions[vote.session].video) {
      html += '<a class="action" href="' + videoHref(vote) + '">▶ Im Video ansehen</a>';
    }
    if (vote.vorlage) {
      html += '<a class="action" href="' + esc(vote.vorlage) +
        '" target="_blank" rel="noopener noreferrer">Vorlage im Ratsinformationssystem ↗</a>';
    }
    html += '</div>';

    html += '<div class="summary">' +
      stat(t.ja, 'Ja') + stat(t.nein, 'Nein') + stat(t.enthaltung, 'Enthaltung') +
      stat(vote.cast, 'Abgegeben') + stat(vote.present, 'Anwesend') + '</div>';

    // Two separate guarantees, per voting-analysis.md: the screen's own totals
    // adding up says nothing about whether the vote had finished.
    html += '<div class="quality">' +
      (vote.checksum_ok
        ? '<span class="ok">✓</span> Die Summen des Abstimmungsbildschirms stimmen mit den ausgezählten Stimmen überein.'
        : '<span class="warn">!</span> Die Summen des Abstimmungsbildschirms stimmen nicht mit den ausgezählten Stimmen überein.') +
      '<br />Das Ergebnis war beim Auslesen seit ' + vote.settled_sec + ' s unverändert.' +
      '</div>';

    var groups = {};
    vote.rows.forEach(function(row) {
      var g = rowGroup(row) || 'ohne Fraktion';
      (groups[g] = groups[g] || []).push(row);
    });

    Object.keys(groups).sort().forEach(function(g) {
      var s = groupSplit(vote, g);
      html += '<div class="group-block"><div class="group-head">' +
        '<h3>' + esc(g) + '</h3><span class="split">' +
        '<b class="v-ja">' + s.ja + '</b> Ja · <b class="v-nein">' + s.nein + '</b> Nein · ' +
        '<b class="v-enth">' + s.enthaltung + '</b> Enthaltung</span></div><div class="member-grid">';

      groups[g].sort(function(a, b) {
        return personName(a[0]).localeCompare(personName(b[0]), 'de');
      }).forEach(function(row) {
        html += '<div class="member">' +
          '<a class="mname" href="' + personHref(row[0]) + '">' + esc(personName(row[0])) + '</a>' +
          chip(row[1]) + '</div>';
      });
      html += '</div></div>';
    });

    document.getElementById('view').innerHTML = html;
  }

  function stat(n, label) {
    return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + esc(label) + '</div></div>';
  }

  // ----------------------------------------------------------- person view

  function renderPerson(pid) {
    var person = DATA.persons[pid];
    var counts = [0, 0, 0, 0, 0];
    var withGroup = 0, castTotal = 0;
    var rows = [];

    DATA.votes.forEach(function(v) {
      var row = findRow(v, pid);
      if (!row) return;
      counts[row[1]]++;
      rows.push({ vote: v, code: row[1] });
      if (row[1] === JA || row[1] === NEIN || row[1] === ENTH) {
        castTotal++;
        if (votedWithGroup(v, row)) withGroup++;
      }
    });

    var attended = rows.length - counts[ABSENT];
    var speech = appearanceStats(pid);

    var membersParams = new URLSearchParams();
    if (person.kind && person.kind !== 'rat') membersParams.set('gremium', person.kind);
    var html = '<a class="back" href="' + membersHref(membersParams) + '">← Alle Mitglieder</a>' +
      '<div class="detail-head">' +
      '<h2>' + esc(person.name) + '</h2>' +
      '<div class="detail-meta">' +
      (person.party ? '<span>' + esc(person.party) + '</span>' : '') +
      (person.voted ? '<span>' + esc(person.group || 'ohne Fraktion') + '</span>' : '') +
      (person.role ? '<span>' + esc(person.role) + '</span>' : '') +
      '</div><div class="detail-meta">' +
      (person.first ? '<span>' + esc(periodLabel(person)) + '</span>' : '') +
      (rows.length ? '<span>' + rows.length + ' erfasste Abstimmungen</span>' : '') +
      (speech.count ? '<span>' + countLabel(speech.count, 'Auftritt', 'Auftritte') + '</span>' : '') +
      '</div></div>';

    if (rows.length) {
      var filtered = new URLSearchParams();
      filtered.set('person', pid);
      html += '<div class="detail-actions"><a class="action" href="' + listHref(filtered) +
        '">Abstimmungen filtern</a></div>';
    }

    if (person.unmatched) {
      html += '<div class="note">Dieser Name konnte keinem Eintrag in persons.json zugeordnet ' +
        'werden. Die Stimmen stammen unverändert vom Abstimmungsbildschirm.</div>';
    }

    if (rows.length) {
      html += '<div class="summary">' +
        stat(counts[JA], 'Ja') + stat(counts[NEIN], 'Nein') + stat(counts[ENTH], 'Enthaltung') +
        stat(counts[NO_VOTE], 'Ohne Stimme') + stat(counts[ABSENT], 'Abwesend') +
        stat(attended ? Math.round(castTotal / attended * 100) + '%' : 'n/a', 'Teilnahme') +
        stat(castTotal ? Math.round(withGroup / castTotal * 100) + '%' : 'n/a', 'Fraktionstreue') +
        stat(castTotal - withGroup, 'Abweichungen') +
        '</div>';

      html += '<div class="quality">Teilnahme: abgegebene Stimmen von den Abstimmungen, bei denen ' +
        'die Person anwesend war. Fraktionstreue: Anteil der abgegebenen Stimmen, die der Mehrheit ' +
        'der eigenen Fraktion entsprachen; Abweichungen sind die übrigen.</div>';
    }

    html += appearancesHtml(pid, speech);

    if (!rows.length) {
      html += '<div class="empty">Keine Abstimmungen erfasst.</div>';
    } else {
      html += '<div class="group-block"><div class="group-head"><h3>Abstimmungen</h3>' +
        '<span class="split">' + rows.length + ' erfasst</span></div></div>';
      html += '<div class="table-wrap"><table><thead><tr><th class="col-date">Datum</th><th class="col-top">TOP</th>' +
        '<th class="col-ref">Vorlage</th><th>Titel</th><th>Stimme</th>' +
        '<th class="col-result">Ergebnis</th></tr></thead><tbody>';
      rows.forEach(function(r) {
        var v = r.vote;
        html += '<tr data-key="' + esc(v.key) + '">' +
          '<td class="col-date">' + esc(DATA.sessions[v.session].title) + '</td>' +
          '<td class="col-top">' + esc(v.agenda) + '</td>' +
          '<td class="col-ref">' + (v.vorlage
            ? '<a href="' + esc(v.vorlage) + '" target="_blank" rel="noopener noreferrer">' + esc(v.reference) + ' ↗</a>'
            : esc(v.reference)) + '</td>' +
          '<td class="col-title">' + esc(v.title) + '</td>' +
          '<td>' + chip(r.code) + '</td>' +
          '<td class="col-result">' + tallyBar(v) + resultLabel(v) + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }

    var view = document.getElementById('view');
    view.innerHTML = html;
    view.querySelectorAll('tbody tr').forEach(function(tr) {
      tr.addEventListener('click', function(e) {
        if (e.target.closest('a')) return;
        location.hash = voteHref(tr.dataset.key);
      });
    });
    wireAppearanceToggle();
  }

  // ------------------------------------------------------- appearances block

  /** Kept across renders so the toggle survives a walk through several people. */
  var showShortAppearances = false;

  function appearancesHtml(pid, speech) {
    if (!speech.count) return '';

    var html = '<div class="group-block"><div class="group-head"><h3>Auftritte</h3>' +
      '<span class="split">' + speech.count + ' in ' +
      countLabel(speech.sessions, 'Sitzung', 'Sitzungen') + ' · ' +
      formatDuration(speech.seconds) + ' · <b class="v-ja">' + speech.podium + '</b> am Pult</span>' +
      (speech.short
        ? '<button class="section-toggle" id="toggle-short" data-count="' + speech.short + '"></button>'
        : '') +
      '</div>';

    personAppearances(pid).forEach(function(block) {
      var session = DATA.sessions[block.session] || { title: block.session };
      var seconds = 0, longEnough = 0;
      block.appearances.forEach(function(a) {
        seconds += appearanceLength(a);
        if (appearanceLength(a) >= SHORT_APPEARANCE_SEC) longEnough++;
      });

      html += '<div class="speech-session' + (longEnough ? '' : ' all-short') + '">' +
        '<h4>' + esc(session.title) + ' · ' + countLabel(block.appearances.length, 'Auftritt', 'Auftritte') +
        ' · ' + formatDuration(seconds) + '</h4><div class="speech-grid">';

      block.appearances.forEach(function(a) {
        var length = appearanceLength(a);
        var camera = cameraName(a[A_CAMERA]);
        var topic = TOPICS[a[A_TOPIC]];
        html += '<a class="speech' + (isPodium(a) ? ' podium' : '') +
          (length < SHORT_APPEARANCE_SEC ? ' short' : '') + '"' +
          ' href="' + esc(appearanceHref(block.session, a)) + '"' +
          ' target="_blank" rel="noopener noreferrer"' +
          ' title="' + formatSeconds(a[A_START]) + ' bis ' + formatSeconds(a[A_END]) +
          ', ' + a[A_PARTS] + ' Erkennung' + (a[A_PARTS] === 1 ? '' : 'en') + '">' +
          '<span class="speech-time">' + formatSeconds(a[A_START]) + '</span>' +
          '<span class="speech-dur">' + formatDuration(length) + '</span>' +
          (topic ? '<span class="speech-topic" title="TOP ' + esc(topic[1]) + ' ' + esc(topic[2]) + '">TOP ' +
            esc(topic[1]) + ' ' + esc(topic[2]) + '</span>' : '') +
          (camera ? '<span class="speech-cam">' + esc(camera) + '</span>' : '') +
          '<span class="speech-open">↗</span></a>';
      });
      html += '</div></div>';
    });

    html += '<div class="quality">Auftritte kommen aus der Gesichtserkennung im Kamerabild: sie ' +
      'sagen, wann die Person zu sehen war, nicht was gesagt wurde. Erkennungen im Abstand von ' +
      'bis zu 30 s sind zu einem Auftritt zusammengefasst, „Pult“ ist die Kamera auf das ' +
      'Redepult. Ein Klick öffnet die Aufzeichnung ' + JUMP_LEAD_SEC + ' s davor in einem neuen Tab.' +
      '</div></div>';

    return html;
  }

  function countLabel(n, singular, plural) {
    return n + ' ' + (n === 1 ? singular : plural);
  }

  function wireAppearanceToggle() {
    var view = document.getElementById('view');
    view.classList.toggle('show-short', showShortAppearances);

    var button = document.getElementById('toggle-short');
    if (!button) return;
    var count = parseInt(button.dataset.count, 10) || 0;

    function label() {
      button.textContent = (showShortAppearances ? '− ' : '+ ') +
        countLabel(count, 'kurzer Auftritt', 'kurze Auftritte') +
        ' (< ' + SHORT_APPEARANCE_SEC + ' s)';
    }
    label();

    button.addEventListener('click', function() {
      showShortAppearances = !showShortAppearances;
      view.classList.toggle('show-short', showShortAppearances);
      label();
    });
  }

  // ----------------------------------------------------------- Redner view

  function renderSpeakers() {
    setTitle('Redner');

    var pids = Object.keys(APPEARANCES).filter(function(pid) {
      return DATA.persons[pid];
    });

    var html = '';

    if (!pids.length) {
      document.getElementById('view').innerHTML = html +
        '<div class="empty">Keine Auftritte erfasst.</div>';
      return;
    }

    var stats = {};
    pids.forEach(function(pid) { stats[pid] = appearanceStats(pid); });
    pids.sort(function(a, b) { return stats[b].seconds - stats[a].seconds; });

    html += '<div class="detail-head"><h2>Redner</h2>' +
      '<div class="detail-meta"><span>' + pids.length + ' Personen mit erfassten Auftritten</span>' +
      '<span>nach Zeit vor der Kamera</span></div></div>';

    html += '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Fraktion</th>' +
      '<th class="col-top">Auftritte</th><th class="col-top">Am Pult</th>' +
      '<th class="col-top">Zeit</th><th class="col-top">Sitzungen</th></tr></thead><tbody>';

    pids.forEach(function(pid) {
      var person = DATA.persons[pid];
      var s = stats[pid];
      html += '<tr data-pid="' + esc(pid) + '">' +
        '<td><a href="' + personHref(pid) + '">' + esc(person.name) + '</a>' +
        (person.role ? '<div class="tally-nums">' + esc(person.role) + '</div>' : '') + '</td>' +
        '<td class="col-date">' + esc(person.group || 'ohne Fraktion') + '</td>' +
        '<td class="col-top">' + s.count + '</td>' +
        '<td class="col-top"><b class="v-ja">' + s.podium + '</b></td>' +
        '<td class="col-top">' + formatDuration(s.seconds) + '</td>' +
        '<td class="col-top">' + s.sessions + '</td></tr>';
    });
    html += '</tbody></table></div>';

    var view = document.getElementById('view');
    view.innerHTML = html;
    view.querySelectorAll('tbody tr').forEach(function(tr) {
      tr.addEventListener('click', function(e) {
        if (e.target.closest('a')) return;
        location.hash = personHref(tr.dataset.pid);
      });
    });
  }

  /** Did this row match the most common cast vote in its own Fraktion?
      A tie counts as a match: the person is with a plurality either way. */
  function votedWithGroup(vote, row) {
    var s = groupSplit(vote, rowGroup(row));
    var mine = row[1] === JA ? s.ja : (row[1] === NEIN ? s.nein : s.enthaltung);
    return mine >= Math.max(s.ja, s.nein, s.enthaltung);
  }

  window.addEventListener('hashchange', route);
  route();
</script>
